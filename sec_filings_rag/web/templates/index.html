<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <script src="https://unpkg.com/htmx.org@2.0.7"></script>
    <title>SEC Filings RAG</title>
    <style>
      body {
        background: #f5f7fa;
      }

      main {
        padding: 32px 0;
      }

      .page-title {
        margin-bottom: 24px;
      }

      .job-card {
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <nav class="blue-grey darken-3">
      <div class="nav-wrapper container">
        <span class="brand-logo">SEC Filings RAG</span>
      </div>
    </nav>
    <main class="container">
      <div class="page-title">
        <h4>Upload SEC Filing PDFs</h4>
        <p class="grey-text text-darken-2">Submit up to 10 PDFs and track educational ingestion runs.</p>
      </div>

      <div class="card">
        <div class="card-content">
          <span class="card-title">PDF Upload</span>
          <form
            hx-post="/upload"
            hx-target="#jobs-list"
            hx-swap="afterbegin"
            method="post"
            enctype="multipart/form-data"
          >
            <div class="file-field input-field">
              <div class="btn blue-grey darken-2 waves-effect waves-light">
                <i class="material-icons left">picture_as_pdf</i>
                <span>Choose PDFs</span>
                <input type="file" name="files" accept="application/pdf,.pdf" multiple>
              </div>
              <div class="file-path-wrapper">
                <input class="file-path validate" type="text" placeholder="Select one or more SEC filing PDFs">
              </div>
            </div>
            <button class="btn waves-effect waves-light blue-grey darken-3" type="submit">
              <i class="material-icons left">cloud_upload</i>
              Upload PDFs
            </button>
          </form>
        </div>
      </div>

      <section id="upload-results" class="section">
        {% include "partials/job_list.html" %}
      </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  </body>
</html>
