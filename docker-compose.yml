services:
  sec-filings-rag-web:
    build: .
    depends_on:
      - sec-filings-rag-redis
      - sec-filings-rag-postgres
    environment:
      SFR_REDIS_URL: redis://sec-filings-rag-redis:6379/0
      SFR_POSTGRES_URL: "postgresql://sec_filings_rag:sec_filings_rag@sec-filings-rag-postgres:5432/sec_filings_rag"
      SFR_OPENAI_API_KEY: "${SFR_OPENAI_API_KEY:?Required environment variable missing: SFR_OPENAI_API_KEY}"
      SFR_SQLITE_DATABASE_PATH: /app/data/sec_filings_rag.sqlite3
      SFR_UPLOAD_DIR: /app/data/uploads
      SFR_MAX_UPLOAD_COUNT: "10"
      SFR_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - sec-filings-rag-data:/app/data

  sec-filings-rag-worker:
    build: .
    command: python -m arq sec_filings_rag.workers.WorkerSettings
    depends_on:
      - sec-filings-rag-redis
      - sec-filings-rag-postgres
    environment:
      SFR_REDIS_URL: redis://sec-filings-rag-redis:6379/0
      SFR_POSTGRES_URL: "postgresql://sec_filings_rag:sec_filings_rag@sec-filings-rag-postgres:5432/sec_filings_rag"
      SFR_OPENAI_API_KEY: "${SFR_OPENAI_API_KEY:?Required environment variable missing: SFR_OPENAI_API_KEY}"
      SFR_SQLITE_DATABASE_PATH: /app/data/sec_filings_rag.sqlite3
      SFR_UPLOAD_DIR: /app/data/uploads
      SFR_MAX_UPLOAD_COUNT: "10"
      SFR_LOG_LEVEL: INFO
      SFR_WORKER_CONCURRENCY: "3"
    volumes:
      - sec-filings-rag-data:/app/data

  sec-filings-rag-redis:
    image: redis:8.8.0

  sec-filings-rag-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sec_filings_rag
      POSTGRES_USER: sec_filings_rag
      POSTGRES_PASSWORD: sec_filings_rag
    volumes:
      - sec-filings-rag-postgres-data:/var/lib/postgresql/data

volumes:
  sec-filings-rag-data:
  sec-filings-rag-postgres-data:
