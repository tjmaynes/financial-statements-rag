{% if errors %}
  <div class="col s12">
    <ul class="collection">
      {% for error in errors %}
        <li class="collection-item red lighten-5 red-text text-darken-4">
          <i class="material-icons left">error_outline</i>
          {{ error.filename }}: {{ error.message }}
        </li>
      {% endfor %}
    </ul>
  </div>
{% endif %}

{% for job in jobs %}
  <div class="col s12 m6">
    {% include "partials/job_status.html" %}
  </div>
{% endfor %}
